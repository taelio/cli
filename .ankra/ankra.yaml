# Ankra application descriptor.
# Ankra reads this file on every analysis run. The options below are this
# application's deploy-time parameter contract - they drive the deploy form and
# are validated on deploy. Edit them here and re-run setup to change it.
apiVersion: ankra.io/v1
kind: Application
metadata:
  name: "tael-cli"
  version: "0.1.0"
  app_version: "0.1.0"
  description: "Tael platform: cli"
  icon: "https://avatars.githubusercontent.com/u/231962624?v=4"
  sources:
    - "https://github.com/taelio/cli"
  maintainers:
    - name: "taelio"
      url: "https://github.com/taelio"
options:
  - name: "image_tag"
    type: "string"
    required: false
    description: "Container image tag to deploy. Use an immutable tag such as sha-<commit> or a semver release, never 'latest'."
  - name: "replicas"
    type: "number"
    default: "1"
    required: false
    description: "Number of pod replicas."
  - name: "target_port"
    type: "number"
    default: "8080"
    required: false
    description: "Container port the application listens on."
  - name: "cpu_request"
    type: "string"
    default: "100m"
    required: false
    description: "CPU request per pod."
  - name: "cpu_limit"
    type: "string"
    default: "500m"
    required: false
    description: "CPU limit per pod."
  - name: "memory_request"
    type: "string"
    default: "128Mi"
    required: false
    description: "Memory request per pod."
  - name: "memory_limit"
    type: "string"
    default: "512Mi"
    required: false
    description: "Memory limit per pod."
  - name: "ingress_enabled"
    type: "boolean"
    default: "false"
    required: false
    description: "Expose the service through an Ingress."
  - name: "ingress_host"
    type: "string"
    default: ""
    required: false
    description: "Ingress hostname (required when ingress is enabled)."
  - name: "ingress_class"
    type: "string"
    default: ""
    required: false
    description: "IngressClass name (e.g. nginx)."
  - name: "ingress_tls_issuer"
    type: "string"
    default: "letsencrypt-prod"
    required: false
    description: "cert-manager ClusterIssuer that mints the Ingress certificate. Leave empty to serve plain HTTP."
